version: 1
extends:
  - content/authors.yml
project:
  title: "Event Selection in Autobiographical Narratives: The Roles of Event Segmentation and Emotional Arousal"
  subtitle: A Reproducible Computational Review
  description: >
    How do event segmentation and emotional arousal during an experience shape which events are included in later autobiographical narratives of that experience?
  keywords:
    - event segmentation 
    - event boundaries
    - emotional arousal
    - autobiographical memory
    - autobiographical narratives
    - event selection
    - narrative construction
    - critical review
  license: MIT
  open_access: true
  numbering:
    figure:
      continue: true
    table:
      continue: true
    equation:
      continue: true
    code:
      continue: true
  plugins:
    - https://github.com/AllenNeuralDynamics/AuthorshipExtractor/releases/latest/download/authorship-plugin.mjs
    - plugins/evidence-explorer-plugin.mjs
    - plugins/figure-lightbox-plugin.mjs
  github: https://github.com/atasevac/literature-review
  bibliography:
    - content/references.bib
  toc:
    - file: content/00_frontmatter.md
    - file: content/01_introduction.md
    - file: content/Methods.md
      title: Methods
    - file: content/evidence_database.md
      title: Evidence Database
    - file: content/provenance.md
      title: Pipeline Provenance
  exports:
    - format: tex
      output: review_manuscript.tex
      template: ./latex/template
    - format: pdf
      output: review_manuscript.pdf
      template: ./latex/template
site:
  template: book-theme
  title: "Autobiographical Narrative Review"
  nav:
    - title: GitHub
      url: https://github.com/atasevac/literature-review
